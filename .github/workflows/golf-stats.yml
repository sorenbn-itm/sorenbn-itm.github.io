name: Golf statistics and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: golf-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: golf/package-lock.json
      - run: npm ci
        working-directory: golf
      - run: node --test
        working-directory: golf
      - run: node golf/scripts/scrape-courses.js
        if: github.event_name != 'push'
      - name: Save daily snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add golf/data/courses.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily golf statistics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - run: npm run build
        working-directory: golf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
